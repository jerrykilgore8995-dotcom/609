name: Independent ngspice limiter recovery causal cross-check
on:
  push:
    branches: [609-rv2-control-voltage-recovery-probe]
    paths: [.github/workflows/609-spice-recovery-causality.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ngspice:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install ngspice
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ngspice
      - name: Generate matched fitted and factory-R28/R30 circuit cases
        run: python3 tools/generate_spice_recovery_cases.py
      - name: Simulate C14 in original SPICE nodal circuit independently
        shell: bash
        run: |
          mkdir -p results/spice
          for folder in spice-cases/*; do
            (cd "$folder" && ngspice -b run.cir > "../../results/spice/$(basename "$folder").log" 2>&1) || { tail -100 "results/spice/$(basename "$folder").log"; exit 1; }
            tail -8 "results/spice/$(basename "$folder").log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-spice-c14-recovery
          path: results/spice
          retention-days: 14
