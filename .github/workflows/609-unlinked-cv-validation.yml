name: MKIV true unlinked Neve limiter C14 factory recovery
on:
  push:
    branches: [609-rv2-control-voltage-recovery-probe]
    paths: [.github/workflows/609-unlinked-cv-validation.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  unlinked:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: combined-deck-g0345c030
          run-id: '45020417541'
          github-token: ${{ github.token }}
          path: build/deck
      - name: Instrument C14 without changing the calibrated circuit behavior
        shell: pwsh
        run: |
          python tools/instrument_recovery_deck.py build/deck/Deck.hpp
          if($LASTEXITCODE){exit $LASTEXITCODE}
          python tools/patch_r28_r30_candidate.py build/deck/Deck.hpp
          exit $LASTEXITCODE
      - name: Build true unlinked control voltage tester
        shell: pwsh
        run: |
          cmake -S plugin -B build-unlinked -A x64 "-DNODAL_DECK_HEADER=$((Resolve-Path build/deck/Deck.hpp).Path)"
          if($LASTEXITCODE){exit $LASTEXITCODE}
          cmake --build build-unlinked --config Release --target ControlVoltageProbe --parallel 4
          exit $LASTEXITCODE
      - name: Measure identical physical recovery at both solver sampling rates
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force results/unlinked | Out-Null
          $exe=(Resolve-Path build-unlinked/Release/ControlVoltageProbe.exe).Path
          foreach($r in @(1,4)){
            foreach($rate in @(44100,88200)){
              $dest="results/unlinked/rec${r}-rate${rate}.csv"
              & $exe limit $r 0 20 10 8 2 $rate > $dest
              if($LASTEXITCODE){throw "Failure $dest"}
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mkiv-true-unlinked-limiter-c14
          path: results/unlinked
          retention-days: 14
