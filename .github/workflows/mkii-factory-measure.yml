name: 609 MKII factory and harmonic measurements
on:
  push:
    branches: [609-mkii-windows]
    paths:
      - '.github/workflows/mkii-factory-measure.yml'
      - 'tools/mkii_factory_measure.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install measurement dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ngspice
          python -m pip install numpy
      - name: Measure original component-level MKII SPICE
        run: python tools/mkii_factory_measure.py
      - name: Upload raw measurement report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 609-MKII-factory-harmonic-measurements
          path: mkii-factory-measurements.json
          if-no-files-found: warn
  vst3:
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: 609-nodal-deck
          path: build/deck
          github-token: ${{ github.token }}
          run-id: '44813157089'
      - uses: actions/download-artifact@v4
        with:
          name: 609-MKII-Windows-x64-VST3
          path: build/target
          github-token: ${{ github.token }}
          run-id: '44824278228'
      - name: Build Windows VST3 test host
        shell: pwsh
        run: |
          $deck=(Resolve-Path build/deck/Deck.hpp).Path
          cmake -S plugin -B build-plugin -A x64 "-DNODAL_DECK_HEADER=$deck"
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          cmake --build build-plugin --config Release --target Vst3Smoke --parallel 4
          exit $LASTEXITCODE
      - name: Measure exact original MKII VST3
        shell: pwsh
        run: |
          $bundle=(Resolve-Path 'build/target/609 MKII.vst3').Path
          $test=(Resolve-Path 'build-plugin/Vst3Smoke_artefacts/Release/Vst3Smoke.exe').Path
          $cases=@(
            @('factory',@(0,0,0,0,8,3,0,1,0,0,1000,0,22.581,0,0.9)),
            @('through100',@(0,0,0,0,8,3,0,0,0,0,100,0,4,0,0.9)),
            @('through1000',@(0,0,0,0,8,3,0,0,0,0,1000,0,4,0,0.9)),
            @('through5000',@(0,0,0,0,8,3,0,0,0,0,5000,0,4,0,0.9)),
            @('through10000',@(0,0,0,0,8,3,0,0,0,0,10000,0,4,0,0.9)),
            @('comp100',@(10,3,0,0,8,3,1,0,0,0,100,0,10,0,0.9)),
            @('comp1000',@(10,3,0,0,8,3,1,0,0,0,1000,0,10,0,0.9)),
            @('comp5000',@(10,3,0,0,8,3,1,0,0,0,5000,0,10,0,0.9)),
            @('comp10000',@(10,3,0,0,8,3,1,0,0,0,10000,0,10,0,0.9)),
            @('limit100',@(0,0,0,0,8,3,0,1,0,0,100,0,20,0,0.9)),
            @('limit1000',@(0,0,0,0,8,3,0,1,0,0,1000,0,20,0,0.9)),
            @('limit5000',@(0,0,0,0,8,3,0,1,0,0,5000,0,20,0,0.9)),
            @('limit10000',@(0,0,0,0,8,3,0,1,0,0,10000,0,20,0,0.9))
          )
          foreach ($entry in $cases) {
            $label=$entry[0]
            $values=$entry[1]
            Write-Host "Measuring $label"
            & $test $bundle --jd-case @values | Out-File -Encoding utf8 "vst3-$label.txt"
            if ($LASTEXITCODE) {exit $LASTEXITCODE}
          }
      - name: Save exact VST3 spectra
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 609-MKII-packaged-VST3-spectra
          path: vst3-*.txt
          if-no-files-found: warn
