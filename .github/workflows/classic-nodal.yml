name: Classic Windows VST3
on:
  push:
    branches: [classic-2254-2264]
    paths: ['classics/**', '.github/workflows/classic-nodal.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ngspice
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice python3-numpy
      - name: Validate the candidate SPICE circuit
        run: python3 classics/verify_spice.py
      - name: Generate nodal decks from SPICE
        run: |
          for model in 2254 2264; do
            python3 classics/seed.py "classics/circuit/$model.cir" "build/$model/seed.raw"
            python3 native/compile_deck.py "classics/circuit/$model.cir" "build/$model/seed.raw" "build/$model/Deck.hpp"
            python3 classics/spice_response.py "classics/circuit/$model.cir" "build/$model/spice.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Classic-SPICE-operating-points
          path: build/

  windows:
    strategy:
      fail-fast: false
      matrix:
        model: [2254, 2264]
    needs: decks
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: Classic-SPICE-operating-points
          path: decks
      - name: Compile the VST3 and benchmark
        shell: pwsh
        run: |
          $deck = (Resolve-Path decks).Path
          cmake -S classics -B build -A x64 "-DDECK_DIR=$deck" -DCLASSIC_PANEL_SNAPSHOT=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --config Release --target Classic${{ matrix.model }}_VST3 Bench${{ matrix.model }} --parallel 4
          exit $LASTEXITCODE
      - name: Verify dynamics and processing
        shell: pwsh
        run: |
          python -m pip install numpy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -u classics/read_dynamics.py ${{ matrix.model }} build/Release/Bench${{ matrix.model }}.exe --require-close --spice-reference "decks/${{ matrix.model }}/spice.json" | Tee-Object -FilePath classic-benchmark.txt
          $dynamics = $LASTEXITCODE
          & build/Release/Bench${{ matrix.model }}.exe | Tee-Object -FilePath classic-benchmark.txt -Append
          if ($LASTEXITCODE -ne 0 -or $dynamics -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.model }}-Dynamics-and-44k1-512
          path: classic-benchmark.txt
      - name: Measure frequency response and factory distortion conditions
        run: python -u classics/measure_factory.py ${{ matrix.model }} build/Release/Bench${{ matrix.model }}.exe --output factory.json --spice-reference "decks/${{ matrix.model }}/spice.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.model }}-Factory-Audit
          path: factory.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.model }}-Nodal-Windows-x64-VST3
          path: build/Classic${{ matrix.model }}_artefacts/Release/VST3/
          if-no-files-found: error
      - name: Capture the mono editor
        shell: pwsh
        run: |
          cmake --build build --config Release --target PanelSnapshot${{ matrix.model }} --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & build/Release/PanelSnapshot${{ matrix.model }}.exe "${{ matrix.model }}-faceplate.png"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.model }}-Faceplate
          path: ${{ matrix.model }}-faceplate.png
          if-no-files-found: error
