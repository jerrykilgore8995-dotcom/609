name: Nickel low-mid chug response validation
on:
  push:
    branches: [feature/dual-nickel-zener-prototype]
    paths:
      - 'experiments/dual_nickel/verify_lowmid_chug.cpp'
      - 'experiments/dual_nickel/DynamicLowMid.hpp'
      - '.github/workflows/nickel-lowmid-chug.yml'
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Configure standalone low-mid test
        run: g++ -std=c++20 -O2 experiments/dual_nickel/verify_lowmid_chug.cpp -o lowmid-chug
      - name: Measure dynamic band and crossover
        run: ./lowmid-chug > lowmid-chug-response.csv
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NickelOpto-Sneap-C4-low-mid-response
          path: lowmid-chug-response.csv
