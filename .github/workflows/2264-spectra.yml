name: 2264 nodal spectra and harmonic measurements
on:
  push:
    branches: [classic-2254-2264]
    paths: ['.github/workflows/2264-spectra.yml','classics/measure_spectra.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spectra:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: Classic-SPICE-operating-points
          path: decks
          github-token: ${{ github.token }}
          run-id: '44836053242'
      - name: Build 2264 nodal measurement executable
        shell: pwsh
        run: |
          $deck=(Resolve-Path decks).Path
          cmake -S classics -B build -A x64 "-DDECK_DIR=$deck"
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          cmake --build build --config Release --target Bench2264 --parallel 4
          exit $LASTEXITCODE
      - name: Measure compressor and limiter spectra
        shell: pwsh
        run: |
          python -m pip install numpy
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          python classics/measure_spectra.py build/Release/Bench2264.exe
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 2264-nodal-K2-K20-spectra
          path: 2264-nodal-spectra.json
          if-no-files-found: warn
