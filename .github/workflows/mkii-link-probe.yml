name: 609 MKII Windows code-speed benchmark
on:
  push:
    branches: [609-mkii-code-speed]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  link-probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: 609-nodal-deck
          path: build/deck
          github-token: ${{ github.token }}
          run-id: '44813157089'
      - name: Build the standalone probe
        shell: pwsh
        run: |
          $deck = (Resolve-Path build/deck).Path
          cmake -S native/mkii-probe -B build/link -A x64 "-DDECK_DIR=$deck"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/link --config Release --parallel 4
          exit $LASTEXITCODE
      - name: Measure timing and linked output
        shell: pwsh
        run: |
          & build/link/Release/LinkProbe.exe 2>&1 | Tee-Object -FilePath mkii-link-benchmark.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & build/link/Release/FastLinkProbe.exe 2>&1 | Tee-Object -FilePath mkii-link-benchmark.txt -Append
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 609-MKII-Windows-link-benchmark
          path: mkii-link-benchmark.txt
