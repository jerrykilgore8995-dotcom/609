name: 609 bounded parity evaluation
on:
  push:
    branches: [bounded-609-parity, jd-timing-calibration]
    paths: ['circuit/**', 'native/**', 'plugin/**', 'tools/**', '.github/workflows/native.yml']
  workflow_dispatch:

jobs:
  circuit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Measure SPICE and generate the native circuit
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice
          python -m pip install numpy
          mkdir build
          python tools/switch_assemblies.py
          git diff --exit-code circuit/switches.inc
          python tools/native_seed.py build/seed.raw
          python native/compile_deck.py circuit build/seed.raw build/Deck.hpp
          python tools/measure.py --ac > build/response.json
          python tools/measure.py --level 0 --level 9 > build/through.json
          python tools/measure.py --level 0 --level 10 --set CEL=1 --set CRL=4 > build/compress.json
          python tools/measure.py --level 10 --level 20 --set LEL=1 > build/limit.json
          python tools/measure_limiter_even.py > build/limiter-even-spice.json
          for ratio in 1 2 3 4 5; do
            python tools/measure.py --level 10 --set CEL=1 --set CTL=11 --set CRL="$ratio" > "build/ratio-spice-$ratio.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-609-circuit
          path: |
            build/Deck.hpp
            build/*.json
  windows:
    needs: circuit
    runs-on: windows-2022
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: compiled-609-circuit
          path: build/deck
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Compile the circuit reference comparison
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p build/kernel
          g++ -std=c++20 -O3 -fno-math-errno -march=x86-64-v3 -I build/deck native/GenerateSolve.cpp -o build/generate.exe
          build/generate.exe build/kernel/GeneratedSolve.hpp
          g++ -std=c++20 -O3 -fno-math-errno -march=x86-64-v3 -I build/deck -I build/kernel native/RealtimeCheck.cpp -o build/realtime-check.exe
      - name: Measure circuit fidelity
        id: fidelity
        continue-on-error: true
        shell: msys2 {0}
        run: |
          set -euo pipefail
          build/realtime-check.exe | tee build/circuit-comparison.txt
      - name: Build the VST3 and test host
        shell: pwsh
        run: |
          cmake -S plugin -B build-plugin -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-plugin --config Release --target Compressor609_VST3 Vst3Smoke --parallel 4
      - name: Measure the packaged VST3 dynamics
        shell: pwsh
        run: |
          python -m pip install numpy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bundle = (Resolve-Path "build-plugin/Compressor609_artefacts/Release/VST3/609.vst3").Path
          $test = (Resolve-Path "build-plugin/Vst3Smoke_artefacts/Release/Vst3Smoke.exe").Path
          foreach ($mode in @("comp", "limit")) {
            $attacks = if ($mode -eq "comp") { @(0,1,2) } else { @(0,1) }
            foreach ($attack in $attacks) {
              python tools/jd_timing.py --engine $test --plugin $bundle --mode $mode --attack $attack --bus --validate --output "build/jd-vst3-$mode-$attack.json"
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
            }
          }
      - name: Test the VST3 offline and at 44.1 kHz / 512 samples
        shell: pwsh
        run: |
          $bundle = (Resolve-Path "build-plugin/Compressor609_artefacts/Release/VST3/609.vst3").Path
          $test = (Resolve-Path "build-plugin/Vst3Smoke_artefacts/Release/Vst3Smoke.exe").Path
          & $test $bundle --offline 2>&1 | Tee-Object -FilePath offline-smoke.txt
          $offline = $LASTEXITCODE
          & $test $bundle 2>&1 | Tee-Object -FilePath smoke-out.txt
          $playback = $LASTEXITCODE
          if ($offline -ne 0 -or $playback -ne 0) { throw "Offline status $offline, playback status $playback" }
          python tools/check_ratio_thd.py build/circuit-comparison.txt build/deck --vst3-log offline-smoke.txt --output build/ratio-thd.tsv
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/check_limiter_even.py build/circuit-comparison.txt build/deck/limiter-even-spice.json offline-smoke.txt --output build/limiter-even.tsv
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item $bundle release -Recurse
          Copy-Item 609-faceplate.png,smoke-out.txt,offline-smoke.txt,build/circuit-comparison.txt,build/ratio-thd.tsv,build/limiter-even.tsv,build/deck/*.json,README.md,docs/bounded-parity.md,docs/limiter-even-110-*.csv release
      - uses: actions/upload-artifact@v4
        with:
          name: 609-Real-World-Audio-Test-Windows-x64-VST3
          path: release
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 609-Windows-x64-Timing-Evaluation
          path: |
            build-plugin/Compressor609_artefacts/Release/VST3/609.vst3
            build/jd-vst3-*.json
            smoke-out.txt
            offline-smoke.txt
            build/ratio-thd.tsv
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 609-Windows-diagnostics
          path: |
            smoke-out.txt
            offline-smoke.txt
            609-faceplate.png
            build/circuit-comparison.txt
            build/ratio-thd.tsv
            build/limiter-even.tsv
          if-no-files-found: ignore
