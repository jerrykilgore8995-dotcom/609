name: 609 circuit and native VST3
on:
  push:
    branches: [main]
    paths: ['circuit/**', 'native/**', 'plugin/**', 'tools/**', '.github/workflows/native.yml']
  workflow_dispatch:

jobs:
  circuit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Measure SPICE and generate the native circuit
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice
          python -m pip install numpy
          mkdir build
          python tools/switch_assemblies.py
          git diff --exit-code circuit/switches.inc
          python tools/native_seed.py build/seed.raw
          python native/compile_deck.py circuit build/seed.raw build/Deck.hpp
          python tools/measure.py --ac > build/response.json
          python tools/measure.py --level 0 --level 9 > build/through.json
          python tools/measure.py --level 0 --level 10 --set CEL=1 --set CRL=4 > build/compress.json
          python tools/measure.py --level 10 --level 20 --set LEL=1 > build/limit.json
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-609-circuit
          path: |
            build/Deck.hpp
            build/*.json
  windows:
    needs: circuit
    runs-on: windows-2022
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: compiled-609-circuit
          path: build/deck
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Compile and exercise the native solver
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p build/kernel
          g++ -std=c++20 -O3 -fno-math-errno -march=x86-64-v3 -I build/deck native/GenerateSolve.cpp -o build/generate.exe
          build/generate.exe build/kernel/GeneratedSolve.hpp
          g++ -std=c++20 -O3 -fno-math-errno -march=x86-64-v3 -pthread -I build/deck -I build/kernel -shared -static native/Runtime.cpp -o build/609-native.dll
          g++ -std=c++20 -O3 -fno-math-errno -march=x86-64-v3 -I build/deck -I build/kernel native/Probe.cpp -o build/probe.exe
      - uses: actions/cache/restore@v4
        with:
          path: build-plugin
          key: 609-vst3-v1-${{ github.sha }}
          restore-keys: 609-vst3-v1-
      - name: Build the VST3 and test host
        shell: pwsh
        run: |
          cmake -S plugin -B build-plugin -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-plugin --config Release --target Compressor609_VST3 Vst3Smoke --parallel 4
      - uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: build-plugin
          key: 609-vst3-v1-${{ github.sha }}
      - name: Record convergence and processing time under drive
        id: cases
        continue-on-error: true
        shell: msys2 {0}
        run: |
          set -uo pipefail
          failed=0
          build/probe.exe | tee build/through-native.txt || failed=1
          build/probe.exe 1 0 4 10 | tee build/compress-native.txt || failed=1
          build/probe.exe 0 1 1 20 | tee build/limit-native.txt || failed=1
          for mode in 0 5 6; do
            build/probe.exe --transient "$mode" | tee "build/stereo-$mode-native.txt" || failed=1
          done
          python tools/verify_native.py build || failed=1
          exit "$failed"
      - name: Verify the VST3 can render offline
        shell: pwsh
        run: |
          $bundle = (Resolve-Path "build-plugin/Compressor609_artefacts/Release/VST3/609.vst3").Path
          $resources = Join-Path $bundle "Contents/Resources"
          New-Item -ItemType Directory -Force $resources | Out-Null
          Copy-Item build/609-native.dll $resources
          $test = (Resolve-Path "build-plugin/Vst3Smoke_artefacts/Release/Vst3Smoke.exe").Path
          & $test $bundle --offline 2>&1 | Tee-Object -FilePath offline-smoke.txt
          if ($LASTEXITCODE -ne 0) { throw "Offline VST3 test exited with code $LASTEXITCODE" }
          New-Item -ItemType Directory -Force offline-preview | Out-Null
          Copy-Item $bundle offline-preview -Recurse
          Copy-Item 609-faceplate.png,offline-smoke.txt offline-preview
          @"
          This preview passed mono and stereo offline rendering in the Windows VST3 test host.
          For REAPER, select Full-speed Offline or 1x Offline when rendering.
          Live playback can miss processing deadlines at 44.1 kHz / 512 samples.
          "@ | Set-Content offline-preview/Offline-preview.txt
      - uses: actions/upload-artifact@v4
        with:
          name: 609-Windows-x64-VST3-Offline-Preview
          path: offline-preview
          if-no-files-found: error
      - name: Test the packaged VST3 during playback
        shell: pwsh
        run: |
          $bundle = (Resolve-Path "build-plugin/Compressor609_artefacts/Release/VST3/609.vst3").Path
          $test = (Resolve-Path "build-plugin/Vst3Smoke_artefacts/Release/Vst3Smoke.exe").Path
          & $test $bundle 2>&1 | Tee-Object -FilePath smoke-out.txt
          if ($LASTEXITCODE -ne 0) { throw "VST3 smoke test exited with code $LASTEXITCODE" }
          if ("${{ steps.cases.outcome }}" -ne "success") { throw "The driven nodal-solver cases failed" }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item $bundle release -Recurse
          Copy-Item 609-faceplate.png,smoke-out.txt,build/*-native.txt,build/deck/*.json,README.md release
      - uses: actions/upload-artifact@v4
        with:
          name: 609-Windows-x64-VST3
          path: release
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 609-Windows-diagnostics
          path: |
            smoke-out.txt
            offline-smoke.txt
            609-faceplate.png
            build/*-native.txt
          if-no-files-found: ignore
