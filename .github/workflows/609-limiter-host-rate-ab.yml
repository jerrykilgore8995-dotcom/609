name: 609 limiter 1kHz 22kHz bandwidth only
on:
  push:
    branches: [609-diodesinc-four-model-1khz]
    paths:
      - .github/workflows/609-limiter-host-rate-ab.yml
      - tools/limiter_host_rate_ab.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate-deck:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        diode: [generic, w, ws, wt]
    steps:
      - uses: actions/checkout@v4
      - name: Install Ngspice for actual 609 operating point
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ngspice
          python -m pip install numpy
      - name: Select exact bridge diode model; do not change circuit values
        run: python tools/diodesinc_bridge_fixture.py ${{ matrix.diode }}
      - name: Generate SPICE deck from operating point and selected model
        run: |
          mkdir -p build/deck
          python tools/native_seed.py build/seed.raw
          python native/compile_deck.py circuit build/seed.raw build/deck/Deck.hpp
      - uses: actions/upload-artifact@v4
        with:
          name: host-rate-deck-${{ matrix.diode }}
          path: build/deck/Deck.hpp
          if-no-files-found: error
          retention-days: 14
  measure-final-vst3:
    needs: generate-deck
    runs-on: windows-2022
    timeout-minutes: 115
    strategy:
      fail-fast: false
      matrix:
        diode: [generic, w, ws, wt]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: host-rate-deck-${{ matrix.diode }}
          path: build/deck
      - name: Build the limiter VST3 from the selected unchanged circuit
        shell: pwsh
        run: |
          $deck=(Resolve-Path build/deck/Deck.hpp).Path
          cmake -S plugin -B build-hostrate -A x64 "-DNODAL_DECK_HEADER=$deck"
          if($LASTEXITCODE){exit $LASTEXITCODE}
          cmake --build build-hostrate --config Release --target Compressor609_VST3 Vst3Smoke --parallel 4 2>&1 | Tee-Object -FilePath build-log.txt
          if($LASTEXITCODE){exit $LASTEXITCODE}
          Write-Host 'Built actual 609 limiter host and plugin'
      - name: Measure ONLY 44.1kHz final plugin output 1kHz K2-K22
        shell: pwsh
        run: |
          $bundle=Get-ChildItem -Recurse -Path build-hostrate -Directory -Filter '*.vst3' | Select-Object -First 1 -ExpandProperty FullName
          $tester=Get-ChildItem -Recurse -Path build-hostrate -File -Filter 'Vst3Smoke.exe' | Select-Object -First 1 -ExpandProperty FullName
          if(!$bundle -or !$tester){throw "Missing VST3 bundle or smoke host"}
          python tools/limiter_host_rate_ab.py "$tester" "$bundle" "${{ matrix.diode }}" results
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 609-limiter-22khz-${{ matrix.diode }}
          path: |
            results/*
            build-log.txt
          retention-days: 14
          if-no-files-found: warn
