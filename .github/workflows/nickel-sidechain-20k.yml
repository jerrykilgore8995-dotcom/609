name: Nickel Opto 20k sidechain investigation
on:
  push:
    branches: [feature/dual-nickel-zener-prototype]
    paths:
      - 'experiments/dual_nickel/measure_sidechain_20khz.cpp'
      - 'experiments/dual_nickel/SidechainFollower.hpp'
      - '.github/workflows/nickel-sidechain-20k.yml'
  workflow_dispatch:
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone sidechain diagnostic
        run: g++ -std=c++20 -O2 experiments/dual_nickel/measure_sidechain_20khz.cpp -o measure-sidechain
      - name: Measure transistor follower and rectifier
        run: ./measure-sidechain > sidechain-frequency-detector.csv
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NickelOpto-sidechain-frequency-detector
          path: sidechain-frequency-detector.csv
