name: 609 MKII Windows VST3
on:
  push:
    branches: [609-mkii-windows]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: 609-nodal-deck
          path: build/deck
          github-token: ${{ github.token }}
          run-id: '44813157089'
      - name: Build the Windows x64 VST3
        shell: pwsh
        run: |
          $deck = (Resolve-Path build/deck/Deck.hpp).Path
          cmake -S plugin -B build-plugin -A x64 "-DNODAL_DECK_HEADER=$deck"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-plugin --config Release --target Compressor609_VST3 --parallel 4
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: 609-MKII-Windows-x64-VST3
          path: build-plugin/Compressor609_artefacts/Release/VST3/
          if-no-files-found: error
