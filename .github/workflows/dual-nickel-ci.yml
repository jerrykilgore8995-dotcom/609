name: Nickel Opto circuit validation
on:
  push:
    branches: [feature/dual-nickel-zener-prototype]
    paths:
      - 'experiments/dual_nickel/**'
      - '.github/workflows/dual-nickel-ci.yml'
  pull_request:
    paths:
      - 'experiments/dual_nickel/**'
      - '.github/workflows/dual-nickel-ci.yml'
  workflow_dispatch:
jobs:
  circuit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S experiments/dual_nickel -B build/nickel -DCMAKE_BUILD_TYPE=Release
      - name: Compile transistor, optical and full-path models
        run: cmake --build build/nickel --target nickel_smoke nickel_option_c nickel_analog_opto nickel_nodal_bjt nickel_opto_character --parallel 2
      - name: Run full physics and signal-path tests
        run: ctest --test-dir build/nickel --output-on-failure
      - name: Output MNA convergence and CPU results
        run: ./build/nickel/nickel_nodal_bjt > nodal-bjt-results.txt
      - name: Optical, low-mid and stereo test results
        run: ./build/nickel/nickel_analog_opto > opto-results.txt
      - name: Report level-dependent opto GR and attack/release
        run: ./build/nickel/nickel_opto_character > opto-character-results.txt
      - name: Install ngspice
        run: sudo apt-get update -qq && sudo apt-get install -qq -y ngspice
      - name: Run transistor-level SPICE reference
        working-directory: experiments/dual_nickel
        run: ngspice -b option_c_reference.cir > ../../reference-spice-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nickel-opto-circuit-measurements
          path: |
            nodal-bjt-results.txt
            opto-results.txt
            opto-character-results.txt
            reference-spice-results.txt
