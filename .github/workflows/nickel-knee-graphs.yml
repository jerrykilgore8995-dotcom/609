name: Optocell soft knee curves
on:
  push:
    branches: [feature/dual-nickel-zener-prototype]
    paths:
      - 'experiments/dual_nickel/measure_opto_knee_fine.cpp'
      - '.github/workflows/nickel-knee-graphs.yml'
  workflow_dispatch:
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S experiments/dual_nickel -B build/nickel -DCMAKE_BUILD_TYPE=Release
      - name: Build optical knee measurement
        run: cmake --build build/nickel --target nickel_opto_knee_fine --parallel 2
      - name: Sweep every 1dB input across all three optical cells
        run: set -o pipefail; ./build/nickel/nickel_opto_knee_fine | tee optical-knee-fine.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NSL32-VTL5C2-T4B-1dB-soft-knees
          path: optical-knee-fine.csv
